name: AI 圈日报自动发布

on:
  # 定时触发：每天早上 8:00 (北京时间) 运行
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京时间 8:00
  
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 安装依赖
        run: npm install
      
      - name: 🔍 拉取 AI HOT 日报
        run: npm run fetch
      
      - name: 📝 整理 AI HOT 日报
        run: npm run summarize
      
      - name: 🎨 格式化为公众号和邮件格式
        run: npm run format

      - name: 🗓️ 读取日报日期
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('output/latest-feed.json','utf8')); console.log('REPORT_DATE=' + (data.date || new Date().toISOString().slice(0,10)))" >> "$GITHUB_ENV"
      
      - name: 📤 发布到公众号
        run: npm run publish
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
      
      - name: 📤 上传生成的文件
        uses: actions/upload-artifact@v4
        if: always()  # 即使前面的步骤失败也上传
        with:
          name: ai-news-daily-${{ github.run_id }}
          path: output/
          retention-days: 30
      
      - name: 📧 发送邮件通知
        uses: dawidd6/action-send-mail@v3
        if: success()
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: AI HOT 日报 - ${{ env.REPORT_DATE }}
          html_body: file://output/latest-email.html
          to: 504029540@qq.com
          from: AI HOT 日报自动推送
      
      - name: 📝 提交生成的文件到仓库
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git commit -m "📅 每日更新: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📢 创建 Issue 通知（如果失败）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ AI 日报生成失败 - ${date}`,
              body: `自动化流程执行失败，请检查 [Actions 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
